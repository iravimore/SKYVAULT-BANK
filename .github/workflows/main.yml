name: Vault OIDC Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  vault-oidc:
    runs-on: self-hosted

    steps:
      - name: Authenticate to Vault and retrieve SonarQube token
        uses: hashicorp/vault-action@v3
        with:
          url: http://127.0.0.1:8200
          method: jwt
          role: skyvault-bank
          jwtGithubAudience: https://github.com/iravimore
          secrets: |
            secret/data/skyvault/sonarqube token | SONAR_TOKEN

      - name: Verify secret retrieval
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SUCCESS: Authenticated to Vault and retrieved SonarQube token."
          else
            echo "ERROR: SonarQube token was not retrieved."
            exit 1
          fi
